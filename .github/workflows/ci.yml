name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test, Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix backend --ignore-scripts
          npm ci --prefix frontend

      - name: G3 - Frontend Lint
        run: npm run lint --prefix frontend

      - name: G1 - Backend Unit & Integration Tests
        run: npm run test:backend

      - name: G2 - Frontend Unit Tests
        run: npm run test:frontend

      - name: G4 - Production Build
        run: npm run build

      - name: G5 - Security Audit (Production Dependencies)
        run: |
          npm audit --omit=dev --prefix backend
          npm audit --omit=dev --prefix frontend

      - name: G6 - End-to-End Smoke Test
        run: node scripts/smoke.js
